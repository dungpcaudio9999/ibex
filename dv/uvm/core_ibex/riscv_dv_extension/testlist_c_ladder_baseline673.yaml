    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +instr_cnt=6000 +num_of_sub_program=0 +no_csr_instr=0 +enable_access_invalid_csr_level=1
    +boot_mode=u

    '
  rtl_test: core_ibex_invalid_csr_test
  sim_opts: '+require_signature_addr=1

    '
