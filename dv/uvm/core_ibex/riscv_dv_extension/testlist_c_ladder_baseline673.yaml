# 'Baseline 673' control list (doc/s5_worklist.md "Baseline 673" task).
#
# Purpose: isolate the coverage gain caused by the 8 new S5 tests'
# CONTENT from the gain caused simply by running ~40% more simulations.
# The S5 extended run (testlist_c_ladder_s5.yaml) produced 673 total
# simulations (480 baseline + 193 new); this list reruns the SAME 39
# unmodified baseline tests (identical gen_opts/rtl_test, no new S5
# content) with EVERY test's native iteration count scaled by the same
# factor (1.4021 = 673/480), rounded, so the total also lands at 673.
# Scaling uniformly preserves the S3 baseline's own per-test weighting
# (some tests get 1 iteration, some get 20) rather than switching to a
# flat per-test override, which would change the test-mix balance in a
# different, uncontrolled way.
#
# Do not hand-edit -- regenerate from testlist_c_ladder.yaml if it changes.

# Scaled total: 672 simulations (target 673).

- test: riscv_arithmetic_basic_test
  description: 'Arithmetic instruction test, no load/store/branch instructions

    '
  gen_opts: '+instr_cnt=10000 +num_of_sub_program=0 +no_fence=1 +no_data_page=1 +no_branch_jump=1 +boot_mode=m

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  rtl_test: core_ibex_base_test
- test: riscv_machine_mode_rand_test
  description: 'Machine mode random instruction test

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=10000 +num_of_sub_program=5 +boot_mode=m

    '
  rtl_test: core_ibex_base_test
- test: riscv_rand_instr_test
  description: 'Random instruction stress test

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=10000 +num_of_sub_program=5 +gen_all_csrs_by_default=1 +add_csr_write=MSTATUS,MEPC,MCAUSE,MTVAL,0x7c0,0x7c1
    +no_csr_instr=0

    '
  rtl_test: core_ibex_base_test
- test: riscv_rand_jump_test
  description: 'Jump among large number of sub-programs, stress testing iTLB operations.

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=15000 +num_of_sub_program=20 +directed_instr_0=riscv_load_store_rand_instr_stream,8

    '
  rtl_test: core_ibex_base_test
- test: riscv_jump_stress_test
  description: 'Stress back to back jump instruction

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=5000 +num_of_sub_program=5 +directed_instr_1=riscv_jal_instr,20

    '
  rtl_test: core_ibex_base_test
- test: riscv_loop_test
  description: 'Loop test

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=10000 +num_of_sub_program=5 +directed_instr_1=riscv_loop_instr,20

    '
  rtl_test: core_ibex_base_test
- test: riscv_mmu_stress_test
  description: 'Test with different patterns of load/store instructions, stress test MMU operations.

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=10000 +num_of_sub_program=5 +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40 +directed_instr_2=riscv_multi_page_load_store_instr_stream,40
    +directed_instr_3=riscv_load_store_rand_addr_instr_stream,40

    '
  rtl_test: core_ibex_base_test
  sim_opts: '+enable_bad_intg_on_uninit_access=0

    '
- test: riscv_illegal_instr_test
  description: 'Illegal instruction test, verify the processor can detect illegal instruction and handle
    corresponding exception properly. An exception handling routine is designed to resume execution after
    illegal instruction exception.

    '
  iterations: 21
  gen_test: riscv_rand_instr_test
  gen_opts: '+illegal_instr_ratio=25

    '
  rtl_test: core_ibex_base_test
- test: riscv_hint_instr_test
  description: 'HINT instruction test, verify the processor can detect HINT instruction treat it as NOP.
    No illegal instruction exception is expected

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+hint_instr_ratio=5

    '
  rtl_test: core_ibex_base_test
- test: riscv_ebreak_test
  description: 'Random instruction test with ebreak instruction enabled. Debug mode is not enabled for
    this test, processor should raise ebreak exception.

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+instr_cnt=6000 +no_ebreak=0

    '
  rtl_test: core_ibex_base_test
- test: riscv_debug_basic_test
  description: 'Randomly assert debug_req_i, random instruction sequence in debug_rom section

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +no_ebreak=1 +no_branch_jump=1 +instr_cnt=6000
    +no_csr_instr=1 +no_fence=1 +num_of_sub_program=0 +randomize_csr=1 +directed_instr_0=ibex_rand_cpuctrlsts_stream,4
    +toggle_dit=1 +toggle_dummy_instr=1

    '
  rtl_test: core_ibex_debug_intr_basic_test
  sim_opts: '+require_signature_addr=1 +max_interval=500 +enable_debug_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
    verbose: 1
- test: riscv_debug_triggers_test
  description: 'Test stimulus includes directed routine which set the breakpoint addr forwards a few instructions.
    This test has no pass/fail criteria, but instead is used to gather appropriate coverage. // rtl_test:core_ibex_single_debug_pulse_test
    // In combination with the test-program, this HALTREQ triggers code that then // enables the DCSR.ebreakm/u
    functionality. From then on, EBREAK instructions trigger the // DUT to run some debug-mode code to
    setup the next breakpoint address.

    '
  iterations: 7
  gen_test: riscv_instr_base_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +no_ebreak=1 +no_branch_jump=1 +instr_cnt=10000
    +no_csr_instr=1 +illegal_instr_ratio=20 +no_fence=1 +num_of_sub_program=0 +randomize_csr=0 +directed_instr_0=ibex_breakpoint_stream,20
    +uvm_set_type_override=ibex_asm_program_gen,ibex_hardware_triggers_asm_program_gen +uvm_set_type_override=riscv_debug_rom_gen,ibex_hardware_triggers_debug_rom_gen
    +uvm_set_type_override=riscv_illegal_instr,ibex_hardware_triggers_illegal_instr

    '
  rtl_test: core_ibex_single_debug_pulse_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1 +enable_bad_intg_on_uninit_access=0

    '
  timeout_s: 600
- test: riscv_debug_stress_test
  description: 'Randomly assert debug_req_i more often, debug_rom is empty, with only a dret instruction

    '
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +no_ebreak=1 +instr_cnt=6000 +no_csr_instr=1 +no_fence=1

    '
  rtl_test: core_ibex_debug_intr_basic_test
  iterations: 21
  sim_opts: '+max_interval=250 +enable_debug_seq=1 +require_signature_addr=1

    '
  compare_opts:
    verbose: 1
- test: riscv_debug_branch_jump_test
  description: 'Randomly assert debug_req_i, insert branch instructions and subprograms into debug_rom
    to make core jump around within the debug_rom

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +no_ebreak=1 +instr_cnt=6000 +no_csr_instr=1
    +no_fence=1 +num_of_sub_program=0 +num_debug_sub_program=2 +randomize_csr=1

    '
  rtl_test: core_ibex_debug_intr_basic_test
  sim_opts: '+require_signature_addr=1 +max_interval=3000 +enable_debug_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
    verbose: 1
- test: riscv_debug_instr_test
  description: 'At a high level, this test checks that Ibex can correctly respond after receiving debug
    stimulus while every supported instruction is in its decoding stage. e.g. If the test detects a LUI
    instruction in the decoding stage, a debug request is generated and sent into Ibex. We never send
    a debug request if we see a LUI instruction again, as we don''t want to send in debug requests for
    every instruction that is executed.

    '
  iterations: 35
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +randomize_csr=1 +no_csr_instr=0 +no_ebreak=1
    +no_fence=0 +no_wfi=0 +directed_instr_0=riscv_load_store_rand_instr_stream,40 +directed_instr_1=riscv_load_store_hazard_instr_stream,40

    '
  rtl_test: core_ibex_debug_instr_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1 +enable_bad_intg_on_uninit_access=0

    '
  compare_opts:
    compare_final_value_only: 1
    verbose: 1
- test: riscv_debug_wfi_test
  description: 'Assert debug_req while core is in WFI sleep state, should jump to debug mode

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +no_ebreak=1 +instr_cnt=6000 +no_csr_instr=1
    +no_fence=1 +no_wfi=0 +set_mstatus_tw=0 +randomize_csr=1 +num_of_sub_program=0

    '
  rtl_test: core_ibex_debug_wfi_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
    verbose: 1
- test: riscv_dret_test
  description: 'Dret instructions will be inserted into generated code, ibex should treat these like illegal
    instructions.

    '
  iterations: 7
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +no_dret=0 +instr_cnt=6000

    '
  rtl_test: core_ibex_dret_test
  sim_opts: '+require_signature_addr=1

    '
- test: riscv_debug_ebreak_test
  description: 'A directed ebreak sequence will be inserted into the debug rom, upon encountering it,
    ibex should jump back to the beginning of debug mode. The sequence is designed to avoid an infinite
    loop.

    '
  iterations: 21
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +enable_ebreak_in_debug_rom=1 +no_csr_instr=1
    +no_fence=1 +no_wfi=1 +no_ebreak=1 +instr_cnt=10000 +randomize_csr=1

    '
  rtl_test: core_ibex_debug_ebreak_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_debug_ebreakmu_test
  description: 'dcsr.ebreakm will be set at the beginning of the test upon the first entry into the debug
    rom. From then on, every ebreak instruction should cause debug mode to be entered.

    '
  iterations: 21
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +set_dcsr_ebreak=1 +no_ebreak=0 +no_csr_instr=1
    +no_fence=1 +no_wfi=1 +instr_cnt=6000 +randomize_csr=1 +num_of_sub_program=0

    '
  rtl_test: core_ibex_debug_ebreakmu_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_debug_csr_entry_test
  description: 'Inject debug stimulus during writes to xSTATUS and xIE

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +randomize_csr=1 +no_csr_instr=1 +enable_dummy_csr_write=1
    +boot_mode=m

    '
  rtl_test: core_ibex_debug_csr_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_irq_in_debug_mode_test
  description: 'Send interrupts while the core is executing in debug mode, should ignore everything

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +enable_interrupt=1 +enable_timer_irq=1 +randomize_csr=1
    +no_csr_instr=1 +no_fence=1

    '
  rtl_test: core_ibex_irq_in_debug_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1 +enable_irq_multiple_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_debug_in_irq_test
  description: 'Send debug stimulus while core is in an interrupt handler

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +enable_interrupt=1 +enable_timer_irq=1 +randomize_csr=1
    +no_csr_instr=1 +no_fence=1

    '
  rtl_test: core_ibex_debug_in_irq_test
  sim_opts: '+require_signature_addr=1 +enable_debug_seq=1 +enable_irq_multiple_seq=1 +enable_bad_intg_on_uninit_access=0

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_assorted_traps_interrupts_debug_test
  description: 'Send assorted, intermixed stimulus to test trap-handling and recovery

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +instr_cnt=20000 +enable_unaligned_load_store=1 +no_wfi=1 +enable_misaligned_instr=1
    +illegal_instr_ratio=5 +enable_interrupt=1 +enable_timer_irq=1 +gen_debug_section=1 +randomize_csr=1
    +no_csr_instr=1 +no_directed_instr=1 +num_of_sub_program=5 +num_debug_sub_program=5

    '
  rtl_test: core_ibex_assorted_traps_interrupts_debug_test
  sim_opts: '+require_signature_addr=1 +enable_bad_intg_on_uninit_access=0

    '
- test: riscv_single_interrupt_test
  description: 'Random instruction test with complete interrupt handling

    '
  iterations: 21
  gen_test: riscv_rand_instr_test
  gen_opts: '+instr_cnt=10000 +require_signature_addr=1 +enable_interrupt=1 +enable_timer_irq=1 +randomize_csr=1
    +directed_instr_0=ibex_rand_cpuctrlsts_stream,4 +toggle_dit=1 +toggle_dummy_instr=1

    '
  rtl_test: core_ibex_debug_intr_basic_test
  sim_opts: '+require_signature_addr=1 +enable_irq_single_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_multiple_interrupt_test
  description: 'Random instruction test with complete interrupt handling

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+instr_cnt=10000 +require_signature_addr=1 +enable_interrupt=1 +enable_timer_irq=1 +randomize_csr=1

    '
  rtl_test: core_ibex_debug_intr_basic_test
  sim_opts: '+require_signature_addr=1 +enable_irq_multiple_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_nested_interrupt_test
  description: 'Assert interrupt, and then assert another interrupt during the first irq_handler routine

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+instr_cnt=10000 +require_signature_addr=1 +enable_interrupt=1 +enable_timer_irq=1 +enable_nested_interrupt=1
    +randomize_csr=1 +no_csr_instr=1

    '
  rtl_test: core_ibex_nested_irq_test
  sim_opts: '+require_signature_addr=1 +enable_irq_multiple_seq=1 +enable_irq_nmi_seq=1 +enable_nested_irq=1
    +enable_bad_intg_on_uninit_access=0

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_interrupt_instr_test
  description: 'At a high level, this test checks that Ibex can correctly respond after receiving interrupt
    stimulus while every supported instruction is in its decoding stage. e.g. If the test detects a LUI
    instruction in the decoding stage, an interrupt is generated and sent into Ibex. We never send an
    interrupt if we see a LUI instruction again, as we don''t want to send interrupts for every instruction
    that is executed.

    '
  iterations: 35
  gen_test: riscv_rand_instr_test
  gen_opts: '+instr_cnt=6000 +require_signature_addr=1 +enable_interrupt=1 +enable_timer_irq=1 +randomize_csr=1
    +no_csr_instr=0 +no_ebreak=1 +no_fence=0 +directed_instr_0=riscv_load_store_rand_instr_stream,40 +directed_instr_1=riscv_load_store_hazard_instr_stream,40

    '
  rtl_test: core_ibex_interrupt_instr_test
  sim_opts: '+require_signature_addr=1 +enable_irq_single_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_interrupt_wfi_test
  description: 'Inject interrupts after a encountering wfi instructions.

    '
  iterations: 21
  gen_test: riscv_rand_instr_test
  gen_opts: '+instr_cnt=6000 +require_signature_addr=1 +enable_interrupt=1 +enable_timer_irq=1 +randomize_csr=1
    +set_mstatus_tw=0 +no_wfi=0

    '
  rtl_test: core_ibex_irq_wfi_test
  sim_opts: '+require_signature_addr=1 +enable_irq_single_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_interrupt_csr_test
  description: 'Inject interrupts during dummy writes to xSTATUS and xIE

    '
  iterations: 14
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +enable_interrupt=1 +enable_timer_irq=1 +randomize_csr=1 +enable_dummy_csr_write=1
    +boot_mode=m

    '
  rtl_test: core_ibex_irq_csr_test
  sim_opts: '+require_signature_addr=1 +enable_irq_single_seq=1

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_csr_test
  description: 'Test all CSR instructions on all implemented CSR registers

    '
  iterations: 7
  no_iss: 1
  rtl_test: core_ibex_csr_test
  sim_opts: '+disable_cosim=1

    '
  no_post_compare: true
  ignore_cosim_log: true
- test: riscv_unaligned_load_store_test
  description: 'Unaligned load/store test, ibex should handle it correctly without raising any exception

    '
  iterations: 7
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=10000 +num_of_sub_program=5 +directed_instr_0=riscv_load_store_rand_instr_stream,20
    +directed_instr_1=riscv_load_store_hazard_instr_stream,20 +directed_instr_2=riscv_multi_page_load_store_instr_stream,20
    +enable_unaligned_load_store=1

    '
  rtl_test: core_ibex_base_test
- test: riscv_mem_error_test
  description: 'Normal random instruction test, but randomly insert instruction fetch or memory load/store
    errors

    '
  iterations: 21
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +instr_cnt=10000 +randomize_csr=1 +gen_all_csrs_by_default=1 +add_csr_write=MSTATUS,MEPC,MCAUSE,MTVAL,0x7c0,0x7c1
    +enable_unaligned_load_store=1 +suppress_pmp_setup=1 +disable_pmp_exception_handler=1

    '
  rtl_test: core_ibex_mem_error_test
  sim_opts: '+enable_mem_intg_err=0 +enable_double_fault_detector=0 +require_signature_addr=1 +enable_bad_intg_on_uninit_access=0

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_mem_intg_error_test
  description: 'Normal random instruction test, but randomly insert memory load/store integrity errors

    '
  iterations: 70
  gen_test: riscv_rand_instr_test
  gen_opts: '+require_signature_addr=1 +instr_cnt=10000 +randomize_csr=1 +enable_unaligned_load_store=1
    +suppress_pmp_setup=1 +enable_interrupt=1

    '
  rtl_test: core_ibex_mem_error_test
  sim_opts: '+enable_mem_intg_err=1 +enable_double_fault_detector=0 +require_signature_addr=1 +enable_bad_intg_on_uninit_access=0

    '
  compare_opts:
    compare_final_value_only: 1
- test: riscv_debug_single_step_test
  description: 'Randomly assert debug_req_i, and set dcsr.step to make ibex execute one insn then re-enter
    debug mode The riscv-dv plusarg +enable_debug_single_step adds a short sequence of assembly (riscv_debug_rom_gen::gen_single_step_logic)
    that single-steps for a randomized number of sequential instructions. It stops setting dcsr.step after
    the counter reaches 0, and then starts the process again the next time an external debug stimulus
    is encountered.

    '
  iterations: 21
  gen_test: riscv_instr_base_test
  gen_opts: '+require_signature_addr=1 +gen_debug_section=1 +no_dret=0 +no_ebreak=0 +no_ecall=0 +no_branch_jump=0
    +instr_cnt=10000 +no_csr_instr=0 +randomize_csr=1 +gen_all_csrs_by_default=1 +add_csr_write=MSTATUS,MEPC,MCAUSE,MTVAL,0x7c0,0x7c1
    +no_fence=0 +no_wfi=0 +num_of_sub_program=1 +enable_debug_single_step=1 +illegal_instr_ratio=5 +hint_instr_ratio=1

    '
  rtl_test: core_ibex_debug_single_step_test
  sim_opts: '+require_signature_addr=1 +max_interval=1500 +enable_debug_seq=1 +enable_bad_intg_on_uninit_access=0

    '
- test: riscv_reset_test
  description: 'Randomly reset the core once in the middle of program execution

    '
  iterations: 21
  gen_test: riscv_rand_instr_test
  gen_opts: '+num_of_sub_program=5 +enable_unaligned_load_store=1 +directed_instr_0=riscv_load_store_rand_instr_stream,10

    '
  rtl_test: core_ibex_reset_test
  compare_opts:
    compare_final_value_only: 1
    verbose: 1
- test: riscv_rv32im_instr_test
  description: 'Random instruction test without compressed instructions

    '
  iterations: 7
  gen_test: riscv_rand_instr_test
  gen_opts: '+disable_compressed_instr=1

    '
  gcc_opts: '-march=rv32im

    '
  rtl_test: core_ibex_base_test
- test: riscv_user_mode_rand_test
  description: 'User mode random instruction tes

    '
  iterations: 14
  gen_test: riscv_instr_base_test
  gen_opts: '+instr_cnt=10000 +num_of_sub_program=5 +boot_mode=u

    '
  rtl_test: core_ibex_base_test
- test: riscv_umode_tw_test
  desc: 'Set mstatus.tw and enable generation of WFI instructions. Boot into U-mode, upon encountering
